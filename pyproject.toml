[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kenya-wealth-agent"
version = "1.0.0"
description = "AI-powered financial advisor for the Kenyan market"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Brian Thuo" },
]
keywords = ["kenya", "finance", "wealth", "tax", "investment", "budget", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ollama>=0.4.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sse-starlette>=2.0.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "colorama>=0.4.6",
    "markdown>=3.5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "nh3>=0.2.15",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6.0",
    "mypy>=1.11",
    "pre-commit>=3.0",
]

[project.scripts]
kenya-wealth-agent = "kenya_wealth_agent.interfaces.cli.app:main"

[project.urls]
Homepage = "https://github.com/yourusername/kenya-wealth-agent"
Repository = "https://github.com/yourusername/kenya-wealth-agent"
Issues = "https://github.com/yourusername/kenya-wealth-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kenya_wealth_agent"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".archive", ".venv", "venv", "__pycache__", ".pytest_cache", "htmlcov"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line-too-long: handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["kenya_wealth_agent"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/kenya_wealth_agent/interfaces/web/routers/*.py" = ["B008"]
"src/kenya_wealth_agent/interfaces/web/dependencies.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["ollama", "ollama.*", "markdown", "markdown.*"]
follow_untyped_imports = true
disable_error_code = ["no-untyped-call"]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--cov=kenya_wealth_agent",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=80",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src/kenya_wealth_agent"]
omit = [
    "*/tests/*",
    "*/interfaces/web/static/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
